# Dependabot keeps npm packages, pinned action SHAs and the container base image current.
# Updates arrive monthly and grouped, so a reviewer sees one pull request per ecosystem.
# Major versions tied to the runtime (Node 24) or to a peer range are held back on purpose.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # TypeScript 7 waits until typescript-eslint supports it (its peer range stops below 6.1).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Node's type definitions follow the runtime's major version (24), not the newest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 2
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 1
    labels: ["dependencies"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # The base image stays on Node 24 LTS until the runtime moves on purpose, in package.json too.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 1
    labels: ["dependencies"]
